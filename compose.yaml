services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-konnectcore}
      POSTGRES_USER: ${POSTGRES_USER:-konnectcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konnectcore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konnectcore} -d ${POSTGRES_DB:-konnectcore}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      # Local development only. Pilot/production must leave this unset or false.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    volumes:
      - .:/app
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
