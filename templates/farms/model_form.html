{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="form-card wide"><p class="eyebrow">Farms and crops</p><h1>{{ title }}</h1><form method="post" class="stack form-grid" novalidate>{% csrf_token %}{{ form.as_p }}<div class="form-actions">{% if cancel_object %}<a href="{% url 'farm_detail' cancel_object.id %}">Cancel</a>{% else %}<a href="{% url cancel_url %}">Cancel</a>{% endif %}<button class="button" type="submit">Save</button></div></form></div>{% endblock %}
