<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}KonnectCore{% endblock %}</title><link rel="stylesheet" href="/static/css/app.css"></head><body><header class="topbar"><a class="brand" href="/">KonnectCore</a>{% if user.is_authenticated %}<div class="top-actions">{% if active_organisation %}<span>{{ active_organisation.name }}</span>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button">Sign out</button></form></div>{% endif %}</header><main class="container">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
